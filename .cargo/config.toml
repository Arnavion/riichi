[target.x86_64-unknown-linux-gnu]
rustflags = ["-Z", "next-solver=coherence"]
rustdocflags = ["-Z", "next-solver=coherence"]

[target.riscv64a23-unknown-linux-gnu]
linker = "riscv64-suse-linux-gcc"
runner = "/usr/bin/qemu-riscv64 -L /usr/riscv64-suse-linux/sys-root -E LD_LIBRARY_PATH=/usr/riscv64-suse-linux/sys-root/lib64"
rustflags = ["-Z", "next-solver=coherence"]
rustdocflags = ["-Z", "next-solver=coherence"]
